<!DOCTYPE html>
<!-- The inline background is the pre-stylesheet flash guard and the macOS overscroll color, so it
     has to match app.scss's own `html` background-color rather than fight it: at #121212 it also
     overrode the base the fallback wallpaper is screen-blended against, which is what mutes it. -->
<html lang="en" style="background-color: #322c58;">

<head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="https://nwrks-cdn.public.prod.nuka.works/static/logo_nwrks.png" />
    <meta name="viewport"
          content="width=device-width, user-scalable=yes, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <meta name="theme-color" content="#121212" />
    <meta name="description" content="NukaWorks creates social products and open tools for the people on both sides of the screen." />
    <meta name="keywords" content="NukaWorks, software company, social products, Moggo, open source, ModularKit" />
    <meta name="author" content="NukaWorks Corporation" />

    <link rel="apple-touch-icon" href="https://nwrks-cdn.public.prod.nuka.works/static/logo_nwrks.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://nuka.works" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nuka.works" />
    <meta property="og:title" content="NukaWorks — Software for human connection" />
    <meta property="og:description" content="Social products, open tools and long-term software thinking from NukaWorks Corporation." />
    <meta property="og:image" content="https://nwrks-cdn.public.prod.nuka.works/static/logo_nwrks.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nuka.works" />
    <meta name="twitter:title" content="NukaWorks — Software for human connection" />
    <meta name="twitter:description" content="Social products, open tools and long-term software thinking from NukaWorks Corporation." />
    <meta name="twitter:image" content="https://nwrks-cdn.public.prod.nuka.works/static/logo_nwrks.png" />

    <title>NukaWorks — Software for human connection</title>

</head>

<!-- No background on body, deliberately: app.scss keeps it transparent so the wallpaper painted on
     the html canvas stays visible. An inline color here beats that rule and paints an opaque slab
     over the canvas, which buried the fallback photo and left .main-footer's backdrop-filter with a
     flat color to blur — i.e. no frosted glass at all until today's photo had loaded. -->
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="app">
        <!-- Static skeleton shown until the company bundle boots. -->
        <div class="sk-shell">
            <header class="sk-header">
                <div class="sk-header-inner">
                    <div class="sk-pivot">
                        <span class="skeleton sk-nav-item" style="width:8rem"></span>
                        <span class="skeleton sk-nav-item" style="width:7rem"></span>
                        <span class="skeleton sk-nav-item" style="width:9rem"></span>
                        <span class="skeleton sk-nav-item" style="width:8rem"></span>
                        <span class="skeleton sk-nav-item" style="width:9rem"></span>
                    </div>
                    <span class="skeleton sk-avatar-tile"></span>
                </div>
            </header>

            <div class="sk-body">
                <div class="sk-content">
                    <div class="sk-meta-row">
                        <span class="skeleton skeleton-meta" style="width:120px"></span>
                        <span class="skeleton skeleton-meta" style="width:80px"></span>
                    </div>
                    <span class="skeleton skeleton-title" style="width:76%;height:5rem"></span>
                    <span class="skeleton skeleton-title" style="width:58%;height:5rem"></span>
                    <span class="skeleton skeleton-line" style="width:100%"></span>
                    <span class="skeleton skeleton-line" style="width:92%"></span>
                    <span class="skeleton skeleton-line" style="width:96%"></span>
                    <span class="skeleton skeleton-line" style="width:80%"></span>
                    <span class="skeleton skeleton-line" style="width:88%"></span>
                    <span class="skeleton skeleton-line" style="width:70%"></span>
                </div>
            </div>

            <footer class="sk-footer">
                <div class="sk-footer-inner">
                    <div class="sk-footer-left">
                        <span class="skeleton sk-footer-logo"></span>
                        <span class="skeleton sk-footer-copy"></span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
