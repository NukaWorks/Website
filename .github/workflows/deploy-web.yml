name: Deploy website to Cloud Run

# The company frontend and API share one IAP-protected Cloud Run service. Serving them from the
# same origin makes the Google SSO boundary cover every route and removes cross-origin API setup.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "patches/**"
      - "terraform/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push website image
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/containers/${{ vars.GCP_CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          docker build -f server/Dockerfile \
            --build-arg VITE_API_BASE_URL= \
            --build-arg VITE_ASSET_BASE_URL="${{ vars.ASSET_BASE_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Terraform owns IAP, environment variables, scaling, and the runtime service account. This
      # updates only the image, so a deploy can never accidentally weaken the SSO boundary.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.image.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet
